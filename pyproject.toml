[project]
name = "ppidc-slidev"
version = "0.1.0"
description = "Slides for Parallel PIDC"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jupyterlab>=4.6.3",
    "manim>=0.20.1",
    "manim-themes",
]

[dependency-groups]
dev = [
    "watchfiles>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ppidc"]

[tool.uv.workspace]
members = [
    "ext/manim-themes",
]

[tool.uv.sources]
manim-themes = { workspace = true }

[tool.pyright]
extraPaths = ["ext/manim-themes"]
